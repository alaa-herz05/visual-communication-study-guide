["Cuneiform","المسمارية","Sumerian wedge-shaped writing pressed into clay tablets with a reed stylus; it began as pictographs (c. 3100 BCE).","كتابة سومرية إسفينية تُضغط على ألواح الطين بقلم قصب؛ بدأت كصور تصويرية (حوالي 3100 ق.م)."],
["Hieroglyphics","الهيروغليفية","Egyptian picture-based writing, from Greek meaning “sacred carving”, used for about 3,500 years.","كتابة مصرية قائمة على الصور، من اليونانية بمعنى “النقش المقدس”، استُخدمت نحو 3500 سنة."],
["Rebus principle","مبدأ الريبس","Using pictures to represent sounds or syllables instead of ideas (e.g., “Bee + Leaf” = “Belief”).","استخدام الصور لتمثيل الأصوات أو المقاطع بدل الأفكار (مثل نحلة + ورقة = Belief)."],
["Alphabet","الأبجدية","A system of about 20–30 letters representing sounds; the word comes from Greek alpha + beta.","نظام من نحو 20–30 حرفاً يمثل الأصوات؛ الكلمة من اليونانية ألفا + بيتا."],
["Illuminated manuscript","المخطوطة المزخرفة","A hand-decorated book with gold or silver leaf that made pages seem to glow, made mostly in monasteries (scriptoria).","كتاب مزخرف يدوياً بأوراق الذهب أو الفضة تجعل الصفحات تبدو متوهجة، صُنع غالباً في الأديرة."],
["Uncials and half-uncials","الأنسيال ونصف الأنسيال","Rounded, easy-to-write scripts used by early Christian monasteries.","خطوط مستديرة سهلة الكتابة استخدمتها الأديرة المسيحية المبكرة."],
["Insular script","الخط الجزري","The Irish version of half-uncials developed in Celtic monasteries.","النسخة الأيرلندية من نصف الأنسيال التي تطورت في الأديرة الكلتية."],
["Papyrus","البردي","A writing material made from the papyrus plant growing along the Nile; it allowed scrolls and manuscripts.","مادة للكتابة تُصنع من نبات البردي على ضفاف النيل؛ سمحت بصناعة اللفائف والمخطوطات."],

["Stylus","القلم (الأداة الكتابية)","A pointed reed tool pressed into wet clay to make cuneiform signs.","أداة قصب مدببة تُضغط على الطين الرطب لصنع العلامات المسمارية."],

const ESSAY=[
["Explain why humans invented writing.","اشرح لماذا اخترع الإنسان الكتابة.","Writing is the visual counterpart of speech. People invented it to overcome the limits of memory, to preserve information across time and place (speech vanishes but writing lasts), and to record knowledge, experiences, and thoughts so civilization could grow. It evolved from early pictures into written language."],
["Trace the evolution of cuneiform and its uses.","تتبّع تطور الكتابة المسمارية واستخداماتها.","Around 3100 BCE the Sumerians created proto-cuneiform pictographs on clay tablets. Pictures were gradually simplified into symbols and then abstract wedge signs made with a reed stylus; about 560 signs became fewer phonetic symbols. It recorded taxes, food storage, trade, law, and administration, and temples controlled the records."],
["Compare Sumerian cuneiform with Egyptian hieroglyphics.","قارن بين المسمارية السومرية والهيروغليفية المصرية.","Sumerians used abstract wedge shapes pressed into clay, while Egyptians kept picture-based signs (hieroglyphs, “sacred carving”) on stone and papyrus. Both were complex, so only priests and scribes could use them. Hieroglyphs also used phonograms and the rebus principle, and could be written in several directions."],
["Explain the rebus principle and the difference between pictograms, ideograms, and phonograms.","اشرح مبدأ الريبس والفرق بين الصور والرموز الفكرية والرموز الصوتية.","The rebus principle lets pictures stand for sounds or syllables (“Bee + Leaf” = “Belief”). A pictogram represents an object (sun), an ideogram an idea (love), and a phonogram a sound (“m”), like an alphabet letter. The progression moves from picture to concept to sound."],
["Describe how the alphabet developed from the Phoenicians to the Latin alphabet and why it mattered.","صف تطور الأبجدية من الفينيقيين إلى اللاتينية وأهميتها.","Phoenicians and Canaanites created a 30-symbol consonant-only script written right to left; Aramaic and Hebrew descended from it, and Aramaic led to Arabic. The Greeks added vowels, and the Romans borrowed Greek letters via the Etruscans, adding G, Y, Z, and later J, U, W for 26 letters. The alphabet made writing easy and democratic, reduced religious control, and spread education, art, and science."],
["Discuss illuminated manuscripts: their purpose and the main regional styles.","ناقش المخطوطات المزخرفة: غرضها وأبرز أساليبها الإقليمية.","They were hand-decorated books made in monasteries to preserve religion, knowledge, and education. Early Christian styles used uncials; Celtic books (Durrow, Lindisfarne, Kells) used interlace, carpet pages, ornate initials, and word spacing; Romanesque art was flat and symbolic, Gothic more natural with everyday scenes; Islamic manuscripts stressed calligraphy and geometric and floral designs."],
["Describe prehistoric visual communication and explain the main differences between the Paleolithic and Neolithic ages.","صف التواصل البصري في عصور ما قبل التاريخ واشرح الفروق الرئيسية بين العصرين الحجري القديم والحديث.","Early humans painted animals on cave walls with charcoal, ochres, and minerals for survival, rituals, and communication, and carved petroglyphs into rock. Paleolithic people (c. 2.5 million–10,000 BCE) hunted, gathered, and were nomadic; the Mesolithic was a transition; Neolithic people (c. 8,000–3,000 BCE) farmed, settled in villages, and developed culture, trade, and technology."],
["Why is Mesopotamia called the Cradle of Civilization, and what was writing first used for there?","لماذا تُسمى بلاد الرافدين مهد الحضارة، ولأي غرض استُخدمت الكتابة فيها أولاً؟","Mesopotamia, the land between the Tigris and Euphrates, had agriculture from around 8000 BCE and saw the invention of the wheel, tools, and writing. Writing first served record keeping: taxes, food storage, and trade, with temples controlling the records."],
["Discuss Egypt’s contributions to visual communication.","ناقش إسهامات مصر في التواصل البصري.","Egyptians kept picture-based hieroglyphs for about 3,500 years, used phonograms and the rebus principle, and wrote in flexible directions. They invented papyrus from the Nile plant, enabling scrolls, and created the first illustrated books such as the Book of the Dead, which combined text and pictures to guide the soul after death."],
["Describe the main features of Celtic book design.","صف السمات الرئيسية لتصميم الكتب الكلتية.","Works such as the Book of Durrow (680 CE), Lindisfarne Gospels (698 CE), and Book of Kells (794–806 CE) mixed Christian themes with Celtic knots and interlace. They used vivid colors, carpet pages, ornate initials, diminuendo, Insular script, and spaces between words. The tradition ended after Viking invasions destroyed monasteries such as Iona and Lindisfarne."]
];

const ESSAY2=[
["Compare xylography and typography in terms of definition, printing unit, material, editing, speed, cost, origin, and historical impact.","قارن بين الزيلوغرافي والتيبوغرافي من حيث التعريف ووحدة الطباعة والمادة والتعديل والسرعة والتكلفة والأصل والأثر التاريخي.","Xylography is relief printing from a raised woodblock; typography prints with independent movable metal or wood letters. Xylography carves a whole page on one block, while typography uses separate reusable letters. Xylography uses wood blocks; typography uses metal (usually) or wood type. Xylography is very hard to edit (the block must be recarved), typography is easy to edit. Xylography is slow and costly per page because of labor-intensive carving; typography is much faster and cheaper for large quantities. Xylography originated in Asia, typography in Europe in the mid-1400s. Xylography was an early step in printing images and texts; typography was a major revolution that spread knowledge and literacy."],
["Why is typography considered one of the greatest advances in civilization?","لماذا تُعدّ الطباعة بالحروف من أعظم تقدّمات الحضارة؟","Invented in mid-1400s Europe, it made books much cheaper and faster than handwritten manuscripts. Spread of knowledge was quick and literacy increased. It is described as almost as important as the invention of writing. It was possible because paper had spread from China to the Arab world and Europe, giving plentiful, standardized material."],
["Explain how block printing works and the relationship between xylography and block printing.","اشرح كيف تعمل الطباعة بالقوالب والعلاقة بين الزيلوغرافي والطباعة بالقوالب.","A design is carved into a block (usually wood, sometimes metal or linoleum); the raised uncarved parts will print and carved-away parts stay white. Ink is rolled on the raised surface and the block is pressed onto paper or fabric. Xylography is the specific art of carving and printing from wood blocks, so every xylograph is block printing, but not every block print is xylography."],
["Describe religious block books: their purpose and main examples.","صف كتب القوالب الدينية: غرضها وأبرز أمثلتها.","Woodblock printing reached Europe from the East, first for playing cards and cheap religious images for ordinary, often illiterate people. These evolved into simple religious block books with full-page woodcuts and short texts, using comic-style pictures to teach about death and sin. Ars Moriendi taught how to face death but also urged the dying to leave property to the Church. Biblia Pauperum and Ars Memorandi showed the life of Christ and religious figures with woodcuts and added watercolor."],
["Explain Gutenberg’s role and the story of the 42-line Bible.","اشرح دور غوتنبرغ وقصة إنجيل الـ42 سطراً.","Printers such as Coster in Holland and Waldfoghel in France experimented with movable type, but Gutenberg in Mainz (c. 1450) created the first full workable system, casting type with a steel punch, brass matrix, and molten lead alloy. He borrowed heavily from Johann Fust to print the 42-line Bible (about 1,282 pages in two volumes, with ligatures and spaces for hand-drawn initials) but could not repay, so Fust took his equipment and the nearly finished Bible. Fust partnered with Peter Schoeffer, completed it, and their firm became the leading early printing house."],
["Describe the early typographic prints and the graphic arts craftsmen involved in book production.","صف أولى المطبوعات بالحروف والحرفيين المشاركين في إنتاج الكتاب.","The first typographic prints included poems, calendars, Latin grammars, and especially the 1454 indulgence letters, printed in large numbers and imitating handwriting. Book production involved many graphic arts craftsmen, such as papermakers, type casters, compositors, printers, and binders, working together in the printing workshop."]
];

show.onclick=()=>{a.classList.add("on");ar.classList.add("on");show.hidden=true;if(!(k in res)){yes.hidden=no.hidden=false}};

r.append(show,yes,no);c.append(r,a);return c}

const tabs=$("#tabs");
["mcq","tf","terms","essay"].forEach(k=>{const b=el("button","tab","");b.dataset.t=k;b.setAttribute("role","tab");b.onclick=()=>{tab=k;render();scrollTo({top:0})};tabs.append(b)});
